<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodge Rush</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
 <div id="app">
    <header>
      <h1>🔥 DODGE RUSH</h1>
      <div id="game-status">Playing 🎮</div>
    </header>
    <main>
      <canvas id="gameCanvas"></canvas>
      
      <!-- Pause Button -->
      <button id="pause-btn">⏸️</button>
      
      <!-- Sound Toggle -->
      <button id="sound-toggle">🔊</button>
      
      <div id="ui-overlay">
        <div id="score-display">Score: 0</div>
        <div id="stats-bar">
          <span id="streak-display">🔥 0x</span>
          <span id="deaths-display">💀 0</span>
          <span id="best-display">🏆 0</span>
        </div>
        
        <!-- Pause Overlay -->
        <div id="pause-overlay" style="display: none;">
          <div class="pause-content">
            <h2>⏸️ PAUSED</h2>
            <p>Press <kbd>Space</kbd> or click Resume</p>
            <button id="resume-btn">▶️ Resume</button>
          </div>
        </div>
        
        <!-- Game Over Overlay -->
        <div id="game-over" style="display: none;">
          <h2>💀 YOU DIED!</h2>
          <div class="game-over-stats">
            <p>Score: <span id="final-score">0</span></p>
            <p>Best: <span id="best-score">0</span></p>
            <p>Total Deaths: <span id="total-deaths">0</span></p>
            <p>Streak: <span id="streak-info">0x</span></p>
          </div>
          <div class="game-over-buttons">
            <button id="restart-btn">🔄 Play Again</button>
          </div>
          <p class="hint">💪 "Just one more try!"</p>
        </div>
      </div>
    </main>

    <!-- Auth Modal -->
<div id="auth-modal" style="display: none;">
    <div class="auth-container">
        <h2 id="auth-title">Login</h2>
        <form id="auth-form">
            <input type="text" id="auth-username" placeholder="Username" required>
            <input type="email" id="auth-email" placeholder="Email" style="display: none;">
            <input type="password" id="auth-password" placeholder="Password" required>
            <button type="submit" id="auth-submit">Login</button>
        </form>
        <p id="auth-switch">
            Don't have an account? <a href="#" id="auth-toggle">Register</a>
        </p>
        <p id="auth-error" style="color: #ff4444; display: none;"></p>
    </div>
</div>

<!-- User info -->
<div id="user-info" style="display: none;">
    <span id="username-display"></span>
    <button id="logout-btn">Logout</button>
</div>

    <footer>
      <div id="controls">
        <button id="left-btn" class="mobile-btn">◀</button>
        <button id="right-btn" class="mobile-btn">▶</button>
      </div>
    </footer>
  </div>

  <!-- Socket.IO Client Library -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Main JavaScript -->
  <script type="module" src="/js/main.js"></script>
</body>

</html>
